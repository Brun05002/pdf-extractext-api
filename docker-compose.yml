services:
  api:
    build: .
    image: pdf-extractext/api:latest
    restart: unless-stopped
    environment:
      PORT: ":8000"
      # Ruta principal del stack: entrypoint interno de Traefik (ver D3 de Infrastructure).
      EXTRACTION_URL: ${EXTRACTION_URL:-http://traefik:8090}
      PERSISTENCE_URL: ${PERSISTENCE_URL:-http://persistence:8002}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-16}
    networks:
      - services

# El ruteo público (Traefik) lo declara pdf-extractext-infrastructure.
networks:
  services:
    external: true
    name: pdf-extractext_services
