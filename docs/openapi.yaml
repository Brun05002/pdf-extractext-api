openapi: 3.0.3

info:
  title: PDF ExtracText API
  version: 1.1.0
  description: |
    Microservicio orquestador del Proyecto Cabras. Recibe archivos PDF vía
    multipart/form-data, los reenvía en streaming al microservicio de
    extracción y devuelve el texto extraído al cliente.

    Todos los errores siguen RFC 9457 (`application/problem+json`).
    El header `X-Request-ID` se propaga a los servicios internos para
    correlacionar los logs de los tres microservicios.

servers:
  - url: http://localhost:8000
    description: Entorno local

paths:
  /:
    get:
      summary: Health check del servicio
      operationId: getRoot
      tags:
        - health
      responses:
        "200":
          description: El servicio está operativo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootResponse"

  /upload-pdf:
    post:
      summary: Sube un PDF, extrae su texto y lo persiste
      description: |
        Recibe un archivo PDF, lo reenvía al microservicio de extracción
        bajo un timeout estricto de 30 segundos y persiste el resultado en
        el microservicio de persistencia (`{filename, extracted_text,
        checksum}`, contrato C2). El checksum es único: un PDF ya cargado
        se rechaza con 409 Conflict.
        El archivo se procesa en streaming; su tamaño máximo está limitado
        por `MAX_FILE_SIZE_MB` (20 MB por defecto).
        Los 4xx y el 503 del extractor se propagan tal cual (con su
        `Retry-After` en el 503); solo un fallo de red/timeout o un 500
        del extractor se responde como 502.
      operationId: uploadPdf
      tags:
        - extraction
      parameters:
        - name: X-Request-ID
          in: header
          required: false
          description: Identificador de correlación. Si no se envía, el servidor genera uno.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Archivo PDF a procesar.
      responses:
        "201":
          description: Extracción y persistencia exitosas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          description: Falta el campo multipart `file` o la petición es inválida.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
              example:
                type: urn:pdf-extractext:invalid-request
                title: Petición inválida
                status: 400
                detail: se requiere el campo multipart 'file'
                code: INVALID_REQUEST
        "409":
          description: Ya existe un documento con el mismo checksum (índice único anti-TOCTOU).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
              example:
                type: urn:pdf-extractext:conflict
                title: Conflicto con el recurso
                status: 409
                detail: el documento ya existe
                code: CONFLICT
        "413":
          description: El archivo excede el tamaño máximo permitido.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
              example:
                type: urn:pdf-extractext:request-too-large
                title: Cuerpo demasiado grande
                status: 413
                detail: el archivo excede el tamaño máximo permitido
                code: REQUEST_TOO_LARGE
        "415":
          description: El archivo no es un PDF.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
              example:
                type: urn:pdf-extractext:unsupported-media-type
                title: Tipo de contenido no soportado
                status: 415
                detail: solo se aceptan archivos PDF
                code: UNSUPPORTED_MEDIA_TYPE
        "422":
          description: El contenido del archivo no es un PDF válido (propagado del extractor).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
              example:
                type: urn:pdf-extractext:invalid-pdf-content
                title: Contenido PDF inválido
                status: 422
                detail: El contenido recibido no es un PDF válido
                code: INVALID_PDF_CONTENT
        "500":
          description: Error interno no tipificado.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
              example:
                type: urn:pdf-extractext:internal-error
                title: Error interno del servidor
                status: 500
                detail: error interno del servidor
                code: INTERNAL_ERROR
        "502":
          description: Fallo de red/timeout con el extractor o persistencia, o un 500 del extractor.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
              example:
                type: urn:pdf-extractext:bad-gateway
                title: Fallo en un servicio interno
                status: 502
                detail: fallo en el servicio de extracción
                code: BAD_GATEWAY
        "503":
          description: |
            Extractor saturado (backpressure). Propagado del upstream junto con
            su header `Retry-After`.
          headers:
            Retry-After:
              description: Segundos a esperar antes de reintentar (valor del extractor).
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
              example:
                type: urn:pdf-extractext:service-overloaded
                title: Servicio saturado
                status: 503
                detail: Servicio saturado. Reintente más tarde.
                code: SERVICE_OVERLOADED
        "504":
          description: El servicio de extracción excedió el timeout de 30 segundos.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
              example:
                type: urn:pdf-extractext:gateway-timeout
                title: Tiempo de espera agotado
                status: 504
                detail: el servicio de extracción excedió el tiempo límite
                code: GATEWAY_TIMEOUT

components:
  schemas:
    RootResponse:
      type: object
      properties:
        service:
          type: string
          example: pdf-extractext-api
        status:
          type: string
          example: ok

    ExtractionResponse:
      type: object
      description: Contrato C1 del microservicio de extracción.
      required:
        - content
        - page_count
      properties:
        content:
          type: string
          description: Texto extraído del PDF.
          example: Contrato de arrendamiento entre...
        page_count:
          type: integer
          minimum: 1
          description: Número de páginas procesadas.
          example: 3

    Document:
      type: object
      description: Contrato C2 expuesto por el microservicio de persistencia.
      required:
        - id
        - filename
        - extracted_text
        - checksum
      properties:
        id:
          type: string
          description: Identificador del documento (ObjectId hex de 24 caracteres).
          example: 654f1f77bcf86cd799439011
        filename:
          type: string
          description: Nombre original del archivo PDF.
          example: contrato.pdf
        extracted_text:
          type: string
          description: Texto extraído del PDF.
          example: Contrato de arrendamiento entre...
        checksum:
          type: string
          description: SHA-256 (hex) de los bytes originales del PDF. Único por documento.
          example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08

    ProblemResponse:
      type: object
      description: Detalle de error RFC 9457 (`application/problem+json`).
      required:
        - type
        - title
        - status
        - detail
        - code
      properties:
        type:
          type: string
          description: URN identificatoria del problema.
          enum:
            - urn:pdf-extractext:invalid-request
            - urn:pdf-extractext:not-found
            - urn:pdf-extractext:conflict
            - urn:pdf-extractext:method-not-allowed
            - urn:pdf-extractext:request-too-large
            - urn:pdf-extractext:unsupported-media-type
            - urn:pdf-extractext:invalid-pdf-content
            - urn:pdf-extractext:service-overloaded
            - urn:pdf-extractext:bad-gateway
            - urn:pdf-extractext:gateway-timeout
            - urn:pdf-extractext:internal-error
          example: urn:pdf-extractext:invalid-request
        title:
          type: string
          description: Resumen corto del problema (RFC 9457 §3.1).
          example: Petición inválida
        status:
          type: integer
          description: Código HTTP del problema (RFC 9457 §3.2).
          example: 400
        detail:
          type: string
          description: Explicación legible orientada a la persona cliente.
          example: se requiere el campo multipart 'file'
        code:
          type: string
          description: Miembro de extensión: código machine-readable.
          enum:
            - INVALID_REQUEST
            - NOT_FOUND
            - CONFLICT
            - METHOD_NOT_ALLOWED
            - REQUEST_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - INVALID_PDF_CONTENT
            - SERVICE_OVERLOADED
            - BAD_GATEWAY
            - GATEWAY_TIMEOUT
            - INTERNAL_ERROR
          example: INVALID_REQUEST
